name: StudyFlow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Syntax checks
        run: node --check app.mjs && node --check model.mjs && node --check sw.js
